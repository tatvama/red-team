# vLLM serving one model on NVIDIA GPUs (needs the NVIDIA device plugin or GPU operator).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
data:
  # A Hugging Face repo id, or a path inside the model cache volume.
  VLLM_MODEL: REPLACE-WITH-MODEL
  # Tool-call parser for the model family; see the vLLM docs for your version.
  VLLM_TOOL_PARSER: REPLACE-WITH-PARSER
  VLLM_MAX_MODEL_LEN: "65536"
  VLLM_GPU_MEMORY_UTILIZATION: "0.90"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 300Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vllm
          image: vllm/vllm-openai
          command: ["vllm", "serve"]
          args:
            - $(VLLM_MODEL)
            - --host=0.0.0.0
            - --port=8000
            - --api-key=$(VLLM_API_KEY)
            - --max-model-len=$(VLLM_MAX_MODEL_LEN)
            - --gpu-memory-utilization=$(VLLM_GPU_MEMORY_UTILIZATION)
            - --download-dir=/models
            - --enable-auto-tool-choice
            - --tool-call-parser=$(VLLM_TOOL_PARSER)
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tatvam-secrets
                  key: VLLM_API_KEY
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tatvam-secrets
                  key: HF_TOKEN
                  optional: true
            - name: HF_HOME
              value: /models/hf
            # Writable home for caches, also under the arbitrary UIDs OpenShift assigns.
            - name: HOME
              value: /models
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              cpu: "4"
              memory: 32Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            # Large models can take a long time to download and load.
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
