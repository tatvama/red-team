# Example only: not part of the kustomization, so real values never live in git.
# Create the real secret with:
#   kubectl -n tatvam create secret generic tatvam-secrets \
#     --from-literal=VLLM_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ACCESS_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GITHUB_TOKEN=... --from-literal=HF_TOKEN=...   # optional
apiVersion: v1
kind: Secret
metadata:
  name: tatvam-secrets
  namespace: tatvam
type: Opaque
stringData:
  VLLM_API_KEY: change-me
  ACCESS_TOKEN: change-me
  SESSION_SECRET: change-me
  # GITHUB_TOKEN: optional, for opening pull requests
  # HF_TOKEN: optional, for gated models
  # BRAVE_API_KEY / TAVILY_API_KEY: optional, for web search
